 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #edf2f7;
        }

        .game {
            width: min(92vw, 420px);
            padding: 24px;
            text-align: center;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(23, 32, 51, 0.12);
        }

        h1 {
            margin: 0 0 6px;
        }

        .subtitle,
        .footer {
            color: #667085;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .score {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 4px;
            border-radius: 8px;
            background: #f4f7fb;
        }

        .score span {
            font-size: 1.35rem;
            font-weight: bold;
        }

        .status {
            min-height: 24px;
            font-weight: bold;
        }

        .board {
            width: min(78vw, 300px);
            aspect-ratio: 1;
            margin: 16px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
        }

        .cell {
            width: 100%;
            height: 100%;
            padding: 0;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font: bold 3rem Arial, sans-serif;
            color: #172033;
            background: #f8fafc;
            cursor: pointer;
        }

        .cell:hover {
            background: #eef4ff;
        }

        .reset {
            margin-top: 8px;
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
            color: #fff;
            background: #4f46e5;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game">
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">A little game for two players.</p>

        <div class="scoreboard">
            <div class="score">
                Player X
                <span id="scoreX">0</span>
            </div>

            <div class="score">
                Draws
                <span id="draws">0</span>
            </div>

            <div class="score">
                Player O
                <span id="scoreO">0</span>
            </div>
        </div>

        <p class="status" id="status">Player X's turn</p>

        <div class="board" id="board">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <button class="reset" id="reset">New Game</button>

        <p class="footer">Made for a little friendly competition.</p>
    </div>

    <script src="calender.js"></script>
</body>
</html>
