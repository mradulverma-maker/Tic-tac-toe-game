
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game">
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">A little game for two players.</p>

        <div class="scoreboard">
            <div class="score">
                Player X
                <span id="scoreX">0</span>
            </div>

            <div class="score">
                Draws
                <span id="draws">0</span>
            </div>

            <div class="score">
                Player O
                <span id="scoreO">0</span>
            </div>
        </div>

        <p class="status" id="status">Player X's turn</p>

        <div class="board" id="board">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <button class="reset" id="reset">New Game</button>

        <p class="footer">Made for a little friendly competition.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
